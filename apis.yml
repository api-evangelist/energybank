aid: energybank
name: EnergyBank
description: 'EnergyBank is a New Zealand deep-tech energy company developing next-generation
  energy storage for the offshore wind market. Its core approach firms floating offshore
  wind generation at the turbine so that compute modules can be co-located with the
  generation itself — taking "data to the power rather than electricity to the data"
  — which removes the need for a grid connection, enables consentless high-seas deployment,
  and allows direct ocean cooling of the co-located compute. The company was founded
  by CEO Tim Hawkey and CTO Alex Szczepaniak, and its team combines applied mathematicians,
  electronics engineers, and business development staff with advisors drawn from subsea
  turbomachinery. EnergyBank is venture backed by Version One Ventures, Blackbird,
  Icehouse Ventures, Outset Ventures, Promus Ventures, Nuance Capital, and Boost VC.
  As of this enrichment pass EnergyBank publishes no public API, developer portal,
  SDK, or machine-readable specification — it is a hardware and energy-infrastructure
  company rather than an API provider.'
